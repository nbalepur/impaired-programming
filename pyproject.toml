[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helpful-coding"
version = "0.1.0"
description = "Utilities and judge validation scripts"
requires-python = ">=3.10"
dependencies = [
    "esprima>=4.0.0",
    "openpyxl>=3.1.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "pingouin",
    "notebook",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
